name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  BETTERLEAKS_VERSION: "1.10.1"
  BETTERLEAKS_SHA256: "c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e"

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks (pinned and checksum-verified)
        run: |
          set -euo pipefail
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Block committed .env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$'; then
            echo "::error::Commit .env.example files with empty values only, never .env files."
            exit 1
          fi

      - name: Scan the full git history
        run: betterleaks git . --config .betterleaks.toml --redact --verbose --exit-code 1

      - name: Scan the working tree
        run: betterleaks dir . --config .betterleaks.toml --redact --verbose --exit-code 1
